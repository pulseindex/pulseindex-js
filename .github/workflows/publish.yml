name: Publish

# Fires on a version tag as well as a release, because a tag is what actually
# gets pushed here: v3.1.0, v4.0.0 and v4.0.1 were all tagged, no release was
# ever created, and this workflow had therefore never run once. Every publish so
# far was done by hand, which is also why 4.0.0 reached npm carrying three
# defects that a CI run would have had no opinion about but a second pair of
# eyes on a release page might.
on:
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm provenance and for Trusted Publishing, which is the
      # tokenless path: with the package configured on npmjs.com to trust this
      # repository and this workflow file, `npm publish` needs no secret at all.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      # Trusted Publishing landed in npm 11.5.1. Whatever Node ships today, ask
      # for a CLI new enough that the tokenless path is available rather than
      # silently falling back to needing a secret.
      - name: Use an npm that can publish without a token
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      # A tag that disagrees with package.json publishes the wrong version under
      # the right name, and npm will not let you take it back.
      - name: Refuse a tag that does not match package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p 'require("./package.json").version')"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag $GITHUB_REF_NAME says $tag, package.json says $pkg"
            exit 1
          fi
          echo "tag and package.json agree on $pkg"

      # Provenance rejects a package whose repository.url does not match the
      # repository it was built in, and it rejects it at the registry, after
      # the build, the tests and a signed statement already in the public
      # transparency log. The field was simply absent here, which every manual
      # publish tolerated because none of them asked for provenance.
      - name: Refuse a package.json that provenance will reject
        run: |
          url="$(node -p 'require("./package.json").repository?.url ?? ""')"
          want="github.com/${GITHUB_REPOSITORY}"
          case "$url" in
            *"$want"*) echo "repository.url points at $want" ;;
            "") echo "::error::package.json has no repository.url; provenance requires it to match $want"; exit 1 ;;
            *)  echo "::error::package.json repository.url is $url, expected to contain $want"; exit 1 ;;
          esac

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # Refuses rather than overwrites: republishing a version that already
      # exists is an error on npm, and finding that out here is better than
      # finding it out in a half-finished release.
      - name: Refuse a version that is already published
        run: |
          v="$(node -p 'require("./package.json").version')"
          if npm view "@pulseindex/sdk@$v" version >/dev/null 2>&1; then
            echo "::error::@pulseindex/sdk@$v is already on the registry"
            exit 1
          fi
          echo "$v is not published yet"

      # No NODE_AUTH_TOKEN on purpose. The package is configured on npmjs.com to
      # trust this repository and this workflow file, so npm authenticates over
      # OIDC using the id-token permission above. Passing the variable from a
      # secret that does not exist would write an empty _authToken into .npmrc,
      # and npm would then attempt token auth with an empty token rather than
      # falling through to OIDC: a 401 that reads like a missing secret.
      #
      # If Trusted Publishing is ever removed, add back:
      #   env:
      #     NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      # with an npm **automation** token, which is the type that bypasses 2FA.
      - name: Publish
        run: npm publish --access public --provenance
